<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B0B">
<title>Sierra Executive</title>
<style>
:root{--bg:#0B0B0B;--panel:#111;--line:#24484c;--text:#fff;--muted:#9eb2b4;--accent:#2FE3F2;--accent2:#1BB6C4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 14px;background:#090909;border-bottom:1px solid var(--line)}
.brand{min-width:max-content}.brand b{font-family:Georgia,serif;letter-spacing:.24em;color:var(--accent);font-size:18px}.brand span{display:block;color:var(--muted);font-size:9px;letter-spacing:.14em;margin-top:2px}.tabs{display:flex;gap:7px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#101010;color:var(--muted);padding:9px 13px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer}.tab.active{color:var(--accent);border-color:#28727b;background:#0d191a;box-shadow:inset 0 -2px 0 var(--accent)}
.framewrap{min-height:0;background:#000}.frame{display:none;width:100%;height:100%;border:0;background:#000}.frame.active{display:block}
@media(max-width:700px){.topbar{display:block;padding:8px}.brand{display:none}.tabs{width:100%}.tab{padding:9px 11px;font-size:11px}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand"><b>SIERRA</b><span>EXECUTIVE • OPERATIONS</span></div>
    <div class="tabs">
      <button class="tab active" data-target="career">Career OS</button>
      <button class="tab" data-target="atc">ATC</button>
    </div>
  </div>
  <div class="framewrap">
    <iframe id="career" class="frame active" src="/legacy.html?v=20260823-loc1" title="Sierra Executive Career OS"></iframe>
    <iframe id="atc" class="frame" src="/atc.html" title="Sierra ATC"></iframe>
  </div>
</div>
<script>
const tabs=[...document.querySelectorAll('.tab')];
const frames=[...document.querySelectorAll('.frame')];
tabs.forEach(tab=>tab.addEventListener('click',()=>{
  tabs.forEach(x=>x.classList.remove('active'));
  frames.forEach(x=>x.classList.remove('active'));
  tab.classList.add('active');
  document.getElementById(tab.dataset.target).classList.add('active');
}));

const careerFrame=document.getElementById('career');
careerFrame.addEventListener('load',()=>{
  try{
    const doc=careerFrame.contentDocument;
    if(!doc)return;
    const loadScript=(id,src)=>new Promise(resolve=>{
      if(doc.getElementById(id)){resolve();return;}
      const s=doc.createElement('script');
      s.id=id;s.src=src;s.onload=()=>resolve();s.onerror=()=>resolve();
      doc.body.appendChild(s);
    });
    loadScript('fleetSyncFixScript','/fleet-sync-fix.js?v=20260823-kmev4')
      .then(()=>loadScript('perAircraftLocationFixScript','/per-aircraft-location-fix.js?v=20260823-loc1'))
      .then(()=>loadScript('homeBaseFixScript','/home-base-fix.js?v=20260823-kmev4'))
      .then(()=>loadScript('availabilityBannerFixScript','/availability-banner-fix.js?v=20260821-1'))
      .then(()=>loadScript('westCoastMarketScript','/market-boost.js?v=20260823-west4'));
  }catch(err){
    console.error('Could not install Sierra Career OS fixes',err);
  }
});
</script>
</body>
</html>
